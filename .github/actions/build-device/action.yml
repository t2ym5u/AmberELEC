name: Build one device
description: >
  Builds a single device in the AmberELEC container, restoring the compiler
  cache first and saving it afterwards - including when the build fails, so a
  job that is cut short still leaves the next one less work to do.

inputs:
  device:
    description: Device to build, e.g. RG351P
    required: true
  version:
    description: Version string stamped into the image
    required: true

runs:
  using: composite
  steps:
    # A hosted runner ships ~14G free on '/', far short of what a distro build
    # needs. The build tree is the bulk of it: every one of the 461 packages
    # keeps its build directory, and the image assembly stage then needs room
    # for the rootfs, squashfs and .img on top. A run reached image assembly
    # with 109G free and still died with "No space left on device", so take
    # everything that can be spared.
    - name: Free up disk space
      shell: bash
      run: |
          set -e
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      /usr/local/.ghcup /usr/share/swift \
                      /usr/local/share/powershell /usr/share/miniconda \
                      /opt/az /opt/microsoft /usr/local/julia* \
                      "$AGENT_TOOLSDIRECTORY"
          # Preinstalled images are several GB and the build pulls its own.
          docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean
          df -h /


    # Restored before the build and saved after it, so successive jobs compile
    # less each time. restore-keys takes the newest cache for this device when
    # no exact key matches, which is the normal case - the exact key is unique
    # per job so that saving never collides.
    - name: Restore compiler cache
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/amberelec-ccache
        key: ccache-${{ inputs.device }}-${{ github.run_id }}-${{ github.job }}
        restore-keys: |
          ccache-${{ inputs.device }}-

    # The compiler cache only makes compiling cheaper. What actually costs the
    # hours now is unpack/configure/link/install, which it cannot touch - a
    # second stage with a warm ccache reached 382 packages where the first
    # reached 390. scripts/build and scripts/install both open with a stamp
    # check that exits immediately when the stamp matches, skipping all of
    # that, so carrying the stamps across jobs is what makes a second job
    # pick up where the first stopped.
    #
    # calculate_stamp hashes the package's source-tree files and strips the
    # ROOT prefix, so the hash does not depend on the machine - which is what
    # makes this work on a fresh runner at all.
    #
    # Only the state is kept: .stamps, image/ (which holds the install stamps
    # and the rootfs) and toolchain/. That measured ~1G against a 6.7G tree,
    # because the per-package build directories are the bulk and a skipped
    # package never looks at its own.
    - name: Restore build state
      id: state_restore
      uses: actions/cache/restore@v4
      with:
        path: ~/amberelec-state
        key: state-${{ inputs.device }}-${{ github.run_id }}-${{ github.job }}
        restore-keys: |
          state-${{ inputs.device }}-

    - name: Seed the build volume from the restored state
      if: steps.state_restore.outputs.cache-matched-key != ''
      shell: bash
      run: |
          set -e
          [ -d "$HOME/amberelec-state" ] || exit 0
          vol="amberelec-build-${{ inputs.device }}"
          docker volume inspect "$vol" >/dev/null 2>&1 || docker volume create "$vol" >/dev/null
          docker run --rm --user 0:0 -v "$vol":/build -v "$HOME/amberelec-state":/state:ro \
            "${DOCKER_IMAGE:-ghcr.io/amberelec/amberelec-build:latest}" \
            bash -c 'set -e
              d=$(ls -d /state/build.* 2>/dev/null | head -1) || exit 0
              [ -n "$d" ] || exit 0
              mkdir -p "/build/$(basename "$d")"
              cp -a "$d"/. "/build/$(basename "$d")/"
              chmod -R a+rwX /build
              du -sh /build/* 2>/dev/null | head -5'

    - name: Build ${{ inputs.device }}
      shell: bash
      run: |
          set -e
          export CUSTOM_VERSION="${{ inputs.version }}"

          # The container runs as the runner's uid, whose HOME (/home/runner)
          # does not exist inside it, so setuptools cannot create its default
          # ~/.python-eggs. MarkupSafe installs as a zipped egg holding a C
          # extension, which has to be extracted there to be importable -
          # without it, `import jinja2` fails and systemd's meson reports
          # jinja2 as missing. Point the cache somewhere writable.
          export PYTHON_EGG_CACHE=/tmp/python-eggs

          # config/path would put the compiler cache under BUILD_DIR, which is
          # a container-only volume and vanishes with the job. $HOME/.cache is
          # bind-mounted from the runner by the Makefile, so putting it there
          # is what makes it outlive the job and be cacheable at all.
          mkdir -p "$HOME/.cache/amberelec-ccache"
          export CCACHE_DIR="$HOME/.cache/amberelec-ccache"

          # config/options assigns CCACHE_CACHE_SIZE unconditionally, so the
          # size cannot be set through it; ccache 4.x lets the environment win
          # instead - verified, it reports "(environment) max_size".
          #
          # 2G was too small and the cache thrashed: it sat at ~1.9G, so
          # compiling the mame cores evicted entries that were still needed and
          # the cache grew 4MB across a 5.5h job. Everything evicted gets
          # recompiled next run - mame2015/2016/2010 alone are ~112 minutes.
          # 6G leaves room for a full device build; GitHub allows 10G per
          # repository and evicts least-recently-used entries on its own.
          export CCACHE_MAXSIZE=6G

          # Two parallelism levels multiply: THREADCOUNT packages at once,
          # each with MAKEFLAGS=-j$(nproc) = 4. The nproc default meant ~16
          # concurrent compilers and the runner died with "lost communication
          # with the server"; 1 survived but was far too slow; 2 built.
          #
          # 3 was tried and measured: 382 packages in 6h03, against 382 in
          # 5h53 at 2. No gain at all, so the build is not CPU-bound at this
          # point - raising it only adds memory pressure for nothing. Back to
          # 2, which is the fastest setting that has not killed a runner.
          export THREADCOUNT=2

          make DOCKER_WORK_DIR=/work docker-${{ inputs.device }}

    # Killing the build step does not stop the container it started, which keeps
    # writing into the ccache directory. tar then aborts with "file changed as
    # we read it" and the save is lost - exactly when a timed-out job has the
    # most worth keeping. Quiesce the directory first.
    - name: Stop the build container
      if: always()
      shell: bash
      run: |
          ids=$(docker ps -q 2>/dev/null || true)
          if [ -n "$ids" ]; then
            echo "stopping: $ids"
            docker stop -t 60 $ids >/dev/null 2>&1 || true
          fi
          sync

    # Pulled out of the docker volume, which actions/cache cannot reach, and
    # kept small: stamps, install stamps + rootfs, toolchain. Not the
    # per-package build directories - those are the 6.7G and a stamped
    # package never reopens its own.
    - name: Extract build state
      if: always()
      shell: bash
      run: |
          vol="amberelec-build-${{ inputs.device }}"
          docker volume inspect "$vol" >/dev/null 2>&1 || exit 0
          rm -rf "$HOME/amberelec-state"; mkdir -p "$HOME/amberelec-state"
          docker run --rm --user 0:0 -v "$vol":/build -v "$HOME/amberelec-state":/state \
            "${DOCKER_IMAGE:-ghcr.io/amberelec/amberelec-build:latest}" \
            bash -c 'set -e
              b=$(ls -d /build/build.* 2>/dev/null | head -1) || exit 0
              [ -n "$b" ] || exit 0
              o="/state/$(basename "$b")"; mkdir -p "$o"
              for d in .stamps image toolchain; do
                [ -e "$b/$d" ] && cp -a "$b/$d" "$o/" || true
              done
              chmod -R a+rwX /state' || true
          du -sh "$HOME/amberelec-state" 2>/dev/null || true

    # Hit rate and size, so a cache that is thrashing or not being used shows
    # up here rather than as an unexplained slow build.
    - name: Compiler cache stats
      if: always()
      shell: bash
      run: |
          # Disk headroom at the end: if a run dies on space again, this says
          # how much was actually left rather than leaving it to guesswork.
          df -h / /mnt 2>/dev/null || true
          sudo du -sh /var/lib/docker 2>/dev/null || true
          du -sh "$HOME/.cache/amberelec-ccache" 2>/dev/null || true
          docker run --rm -e CCACHE_DIR=/c -e CCACHE_MAXSIZE=6G \
            -v "$HOME/.cache/amberelec-ccache":/c \
            "${DOCKER_IMAGE:-ghcr.io/amberelec/amberelec-build:latest}" \
            bash -c 'ccache -s 2>/dev/null | head -20' || true

    # restore-keys picks the most recent matching cache, not the largest, so a
    # tiny one saved by a job that barely started will shadow a good one and the
    # next run recompiles from scratch - a cancelled run once published an empty
    # cache that cost a full gcc rebuild. Only save when there is enough here to
    # be worth restoring.
    - name: Check cache is worth saving
      if: always()
      id: cache_check
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
          size=$(du -sm "$HOME/.cache/amberelec-ccache" 2>/dev/null | cut -f1)
          size=${size:-0}
          # Largest cache already published for this device. Comparing against
          # it, rather than a fixed floor, is what stops a short run shadowing
          # a better cache: a fixed 500MB let a 662MB one replace a 2.8G one.
          best=$(gh api "repos/${GITHUB_REPOSITORY}/actions/caches" --paginate \
                   --jq "[.actions_caches[]|select(.key|startswith(\"ccache-${{ inputs.device }}-\"))|.size_in_bytes]|max // 0" \
                 2>/dev/null || echo 0)
          best_mb=$(( ${best:-0} / 1024 / 1024 ))
          echo "this run: ${size}MB, best published: ${best_mb}MB"
          if [ "$size" -ge "$best_mb" ]; then
            echo "save=true" >> "$GITHUB_OUTPUT"
          else
            echo "save=false" >> "$GITHUB_OUTPUT"
            echo "smaller than what is already cached - leaving that in place"
          fi

    # always(), because the point is to keep what a failed or timed-out job
    # already compiled.
    - name: Save compiler cache
      if: always() && steps.cache_check.outputs.save == 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.cache/amberelec-ccache
        key: ccache-${{ inputs.device }}-${{ github.run_id }}-${{ github.job }}

    # Saved whenever there is anything to save: unlike the compiler cache,
    # a state directory from a job that stopped early is still strictly
    # progress - every stamp in it is a package the next job can skip.
    - name: Save build state
      if: always()
      uses: actions/cache/save@v4
      with:
        path: ~/amberelec-state
        key: state-${{ inputs.device }}-${{ github.run_id }}-${{ github.job }}
