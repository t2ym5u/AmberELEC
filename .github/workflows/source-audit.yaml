# Checks that every package source can still be fetched.
#
# Run from CI rather than only a workstation: some upstreams answer a
# residential address but refuse cloud ranges, so a source can look healthy
# locally and still fail the build here.
name: source-audit
on:
  workflow_dispatch:

jobs:
  audit:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: Checkout
      - name: Audit package sources
        run: ./tools/audit-sources
