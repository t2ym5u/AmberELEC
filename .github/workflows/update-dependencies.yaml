name: update-dependencies

# The weekly schedule is deliberately off. `make update` runs
# scripts/update_packages, which rewrites PKG_VERSION and PKG_SHA256 and
# nothing else - it does not touch the patches or the build logic that go
# with a version. That dissociation is the single cause of this fork's
# breakage: commits 8874e922, 5448b86f, d721f8a4, 36b7bc8c and 732bef50
# bumped 136 packages that way while Actions were disabled, none of them
# ever compiled, and recovering took weeks of six-hour builds.
#
# It has been failing on "Resource not accessible by integration" for want
# of PR permission, which is the only reason it has not been reopening that
# hole every Monday - it still pushed 20 update-dependencies-* branches.
#
# Upgrades now go through the batched route in UPDATE-PLAN.md: take the
# whole package directory from upstream, which carries version, patches and
# build logic together, and validate a batch with a build before the next.
#
# Left dispatchable, because the diff it produces is a useful signal of what
# has moved upstream - just not something to merge unexamined.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run dependency metadata update
        run: |
          set -e
          make docker-update

      - name: Check for repository changes
        id: changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git status --porcelain | grep -q .; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate diff summary
        id: diff_summary
        if: steps.changes.outputs.changed == 'true'
        run: |
          summary=$(git diff --stat HEAD)
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo "$summary" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'Update package dependency metadata'
          title: 'Automated package dependency metadata update'
          body: |
            This PR updates `PKG_VERSION` and `PKG_SHA256` values using `make update`.
            Review the package metadata changes before merging.

            <details><summary>Changed packages</summary>

            ```
            ${{ steps.diff_summary.outputs.summary }}
            ```
            </details>
          base: dev
          branch: update-dependencies-${{ github.run_number }}
          labels: dependencies, automation
